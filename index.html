<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HI-IPTV</title>
<style>
  :root {
    --bg: #0d1117; --panel: #151b24; --panel2: #1c2430; --line: #263041;
    --text: #e6edf3; --muted: #8b98a9; --accent: #3ea6ff; --fav: #ffc83d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

  #app { display: grid; grid-template-columns: 200px 340px 1fr; height: 100%; }
  #app.hide-ui { grid-template-columns: 0 0 1fr; }
  #app.hide-ui #cats, #app.hide-ui #channels { display: none; }

  .col { background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; }
  .col h2 { margin: 0; padding: 14px 16px; font-size: 13px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
  .list { overflow-y: auto; flex: 1; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 16px;
    background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; }
  .item:hover { background: var(--panel2); }
  .item.active { background: var(--panel2); box-shadow: inset 3px 0 var(--accent); }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .count { color: var(--muted); font-size: 13px; }
  .item img { width: 40px; height: 28px; object-fit: contain; background: #0006; border-radius: 3px; flex: none; }
  .item .logo-ph { width: 40px; height: 28px; flex: none; }
  .star { color: var(--fav); }

  #tabs { display: flex; border-bottom: 1px solid var(--line); }
  #tabs button { flex: 1; padding: 10px 4px; background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 13px; }
  #tabs button.active { color: var(--text); box-shadow: inset 0 -3px var(--accent); }
  #search { margin: 10px 12px; padding: 9px 12px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; width: calc(100% - 24px); }

  #stage { position: relative; background: #000; min-width: 0; }
  video { width: 100%; height: 100%; background: #000; }
  #osd { position: absolute; left: 0; right: 0; top: 0; padding: 18px 24px;
    background: linear-gradient(#000c, transparent); pointer-events: none;
    opacity: 0; transition: opacity .25s; }
  #osd.show { opacity: 1; }
  #osd .t { font-size: 22px; font-weight: 600; }
  #osd .s { color: var(--muted); }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 24px; color: var(--muted); pointer-events: none; }
  #msg.err { color: #ff8585; }

  #setup { position: fixed; inset: 0; background: #000b; display: none; place-items: center; z-index: 10; }
  #setup.open { display: grid; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 22px; width: min(560px, 92vw); display: grid; gap: 12px; }
  .card h1 { margin: 0 0 4px; font-size: 20px; }
  .card label { color: var(--muted); font-size: 13px; }
  .card input[type=text], .card input[type=url] { width: 100%; padding: 10px 12px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn { padding: 10px 18px; background: var(--accent); color: #04121f; font-weight: 600;
    border: 0; border-radius: 6px; cursor: pointer; }
  .btn.ghost { background: var(--panel2); color: var(--text); }
  .hint { color: var(--muted); font-size: 13px; }

  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
    #stage { order: -1; }
    #cats { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <section class="col" id="cats">
    <h2>Categorias</h2>
    <div id="tabs"></div>
    <div class="list" id="catList"></div>
  </section>
  <section class="col" id="channels">
    <h2>Canais <span id="chCount" class="hint"></span></h2>
    <input id="search" type="search" placeholder="Buscar canal…" autocomplete="off">
    <div class="list" id="chList"></div>
  </section>
  <main id="stage">
    <video id="video" autoplay playsinline></video>
    <div id="osd"><div class="t" id="osdT"></div><div class="s" id="osdS"></div></div>
    <div id="msg">Carregue uma lista para começar</div>
  </main>
</div>

<div id="setup" class="open">
  <div class="card">
    <h1>HI-IPTV</h1>
    <div>
      <label for="url">URL da lista M3U</label>
      <input id="url" type="url" placeholder="http://servidor/get.php?username=…&password=…&type=m3u_plus">
    </div>
    <div>
      <label for="file">…ou arquivo .m3u / .m3u8 local</label>
      <input id="file" type="file" accept=".m3u,.m3u8,.txt">
    </div>
    <div class="row">
      <input id="useProxy" type="checkbox">
      <label for="useProxy">Usar proxy local (contorna CORS; requer <code>python serve.py</code>)</label>
    </div>
    <div class="row">
      <button class="btn" id="load">Carregar</button>
      <button class="btn ghost" id="cancel">Fechar</button>
      <span class="hint" id="setupMsg"></span>
    </div>
    <div class="hint">Atalhos: <b>↑↓←→</b> navegar · <b>Enter</b> assistir · <b>F</b> favoritar ·
      <b>T</b> trocar aba · <b>H</b> esconder painéis · <b>M</b> menu/lista · <b>PgUp/PgDn</b> canal anterior/próximo · <b>/</b> buscar</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  const FAV = '★ Favoritos', ALL = 'Todos os canais';
  let channels = [];          // {id,name,logo,group,url}
  let cat = ALL;
  let kind = 'live';          // live | movie | series
  const KINDS = [['live', 'Ao vivo'], ['movie', 'Filmes'], ['series', 'Séries']];
  let visible = [];           // canais da lista atual
  let current = null;
  let favs = new Set(store.get('favs', []));
  let engine = null, osdTimer = null;   // engine: instância hls.js ou mpegts.js
  const video = $('video');

  // ---------- M3U ----------
  function parseM3U(text) {
    const out = [];
    let meta = null;
    for (const raw of text.split(/\r?\n/)) {
      const line = raw.trim();
      if (!line) continue;
      if (line.startsWith('#EXTINF')) {
        const attr = k => (line.match(new RegExp(k + '="([^"]*)"', 'i')) || [])[1] || '';
        const name = line.slice(line.lastIndexOf(',') + 1).trim();
        meta = { name: name || attr('tvg-name') || 'Sem nome', logo: attr('tvg-logo'), group: attr('group-title') || 'Sem categoria' };
      } else if (line.startsWith('#EXTGRP:') && meta) {
        meta.group = line.slice(8).trim() || meta.group;
      } else if (!line.startsWith('#')) {
        out.push({ id: out.length, url: line, kind: /\/movie\//.test(line) ? 'movie' : /\/series\//.test(line) ? 'series' : 'live', ...(meta || { name: line, logo: '', group: 'Sem categoria' }) });
        meta = null;
      }
    }
    return out;
  }

  // ---------- Render ----------
  function categories() {
    const map = new Map();
    const pool = channels.filter(c => c.kind === kind);
    for (const c of pool) map.set(c.group, (map.get(c.group) || 0) + 1);
    return [[FAV, pool.filter(c => favs.has(c.url)).length], [ALL, pool.length],
            ...[...map].sort((a, b) => a[0].localeCompare(b[0]))];
  }

  function item(html, active) {
    const b = document.createElement('button');
    b.className = 'item' + (active ? ' active' : '');
    b.innerHTML = html;
    return b;
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function renderTabs() {
    const box = $('tabs'); box.textContent = '';
    for (const [k, label] of KINDS) {
      const b = document.createElement('button');
      b.textContent = label; b.className = k === kind ? 'active' : '';
      b.onclick = () => { kind = k; cat = ALL; $('search').value = ''; renderTabs(); renderCats(); renderChannels(); };
      box.appendChild(b);
    }
  }

  function renderCats() {
    const box = $('catList'); box.textContent = '';
    for (const [name, n] of categories()) {
      const b = item(`<span class="name">${esc(name)}</span><span class="count">${n}</span>`, name === cat);
      b.onclick = () => { cat = name; $('search').value = ''; renderCats(); renderChannels(); };
      box.appendChild(b);
    }
  }

  function renderChannels() {
    const q = $('search').value.trim().toLowerCase();
    visible = channels.filter(c => c.kind === kind &&
      (cat === ALL || (cat === FAV ? favs.has(c.url) : c.group === cat)) &&
      (!q || c.name.toLowerCase().includes(q)));
    $('chCount').textContent = `(${visible.length})`;
    const box = $('chList'); box.textContent = '';
    const frag = document.createDocumentFragment();
    // Listas IPTV passam de 10k canais: limita o DOM e deixa a busca refinar.
    for (const c of visible.slice(0, 600)) {
      const logo = c.logo ? `<img src="${esc(c.logo)}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">` : '<span class="logo-ph"></span>';
      const b = item(`${logo}<span class="name">${esc(c.name)}</span>${favs.has(c.url) ? '<span class="star">★</span>' : ''}`, current && current.url === c.url);
      b.dataset.id = c.id;
      b.onclick = () => play(c);
      frag.appendChild(b);
    }
    box.appendChild(frag);
    if (visible.length > 600) $('chCount').textContent += ' · refine a busca';
  }

  // ---------- Player ----------
  function showMsg(t, err) { const m = $('msg'); m.textContent = t || ''; m.className = err ? 'err' : ''; }
  function osd(c) {
    $('osdT').textContent = c.name; $('osdS').textContent = c.group;
    $('osd').classList.add('show');
    clearTimeout(osdTimer); osdTimer = setTimeout(() => $('osd').classList.remove('show'), 4000);
  }
  function destroyEngine() {
    if (engine) { try { engine.destroy(); } catch {} engine = null; }
    video.removeAttribute('src'); video.load();
  }

  function play(c) {
    current = c; store.set('last', c.url);
    osd(c); showMsg('Carregando…');
    destroyEngine();
    const src = $('useProxy').checked ? '/proxy?u=' + encodeURIComponent(c.url) : c.url;
    const path = c.url.split('?')[0].toLowerCase();
    const isHls = path.endsWith('.m3u8');
    const isFile = /\.(mp4|mkv|webm|mov)$/.test(path);

    if (isHls && window.Hls && Hls.isSupported()) {
      engine = new Hls();
      engine.loadSource(src); engine.attachMedia(video);
      engine.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      engine.on(Hls.Events.ERROR, (_, d) => {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) showMsg('Erro de rede/CORS. Tente ativar o proxy local.', true);
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) engine.recoverMediaError();
        else showMsg('Não foi possível reproduzir este canal.', true);
      });
    } else if (!isHls && !isFile && window.mpegts && mpegts.isSupported()) {
      // Xtream/TS cru (ex.: http://host/user/pass/123 ou .ts)
      engine = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: src });
      engine.attachMediaElement(video);
      engine.on(mpegts.Events.ERROR, () => showMsg('Falha no stream. CORS ou canal fora do ar — tente o proxy local.', true));
      engine.load(); engine.play();
    } else {
      video.src = src; video.play().catch(() => {});   // HLS nativo (Safari/TV) ou arquivo direto
    }
    renderChannels();
  }
  video.addEventListener('playing', () => showMsg(''));
  video.addEventListener('error', () => { if (!engine && current) showMsg('Formato não suportado pelo navegador.', true); });

  function step(d) {
    if (!visible.length) return;
    const i = visible.findIndex(c => current && c.url === current.url);
    play(visible[(i + d + visible.length) % visible.length]);
  }

  function toggleFav(c) {
    if (!c) return;
    favs.has(c.url) ? favs.delete(c.url) : favs.add(c.url);
    store.set('favs', [...favs]); renderCats(); renderChannels();
  }

  // ---------- Carregar lista ----------
  function ingest(text) {
    const list = parseM3U(text);
    if (!list.length) throw new Error('Nenhum canal encontrado na lista.');
    channels = list; cat = ALL;
    kind = channels.some(c => c.kind === 'live') ? 'live' : channels[0].kind;
    renderTabs(); renderCats(); renderChannels();
    $('setup').classList.remove('open');
    showMsg('Escolha um canal');
    const last = store.get('last');
    const c = channels.find(x => x.url === last);
    if (c) { kind = c.kind; renderTabs(); renderCats(); renderChannels(); play(c); }
  }

  async function fetchList(url) {
    const target = $('useProxy').checked ? '/proxy?u=' + encodeURIComponent(url) : url;
    const r = await fetch(target);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }

  $('load').onclick = async () => {
    const msg = $('setupMsg'); msg.textContent = 'Carregando…';
    try {
      const f = $('file').files[0];
      const url = $('url').value.trim();
      let text;
      if (f) text = await f.text();
      else if (url) { text = await fetchList(url); store.set('url', url); store.set('proxy', $('useProxy').checked); }
      else throw new Error('Informe uma URL ou escolha um arquivo.');
      ingest(text); msg.textContent = '';
    } catch (e) { msg.textContent = 'Erro: ' + e.message + (/fetch|Failed/i.test(e.message) ? ' (CORS? tente o proxy)' : ''); }
  };
  $('cancel').onclick = () => $('setup').classList.remove('open');
  $('search').addEventListener('input', renderChannels);

  // ---------- Teclado / controle remoto (D-pad) ----------
  const colsOrder = ['catList', 'chList'];
  function focusables(listId) { return [...$(listId).querySelectorAll('.item')]; }
  function moveFocus(dy) {
    const a = document.activeElement;
    const list = a && a.closest && a.closest('.list');
    if (!list) { const first = focusables('chList')[0] || focusables('catList')[0]; first && first.focus(); return; }
    const items = focusables(list.id), i = items.indexOf(a);
    const n = items[Math.max(0, Math.min(items.length - 1, i + dy))];
    n && n.focus();
  }
  function hop(dx) {
    const a = document.activeElement, list = a && a.closest && a.closest('.list');
    const idx = list ? colsOrder.indexOf(list.id) : -1;
    if (idx === -1) { (focusables('chList')[0] || focusables('catList')[0] || document.body).focus(); return; }
    const t = idx + dx;
    if (t < 0 || t > 1) { if (dx > 0) video.focus(); return; }
    const items = focusables(colsOrder[t]);
    (items.find(x => x.classList.contains('active')) || items[0] || a).focus();
  }

  document.addEventListener('keydown', e => {
    if ($('setup').classList.contains('open')) { if (e.key === 'Escape') $('setup').classList.remove('open'); return; }
    const typing = document.activeElement === $('search');
    if (typing) { if (e.key === 'Escape' || e.key === 'ArrowDown') { e.preventDefault(); $('search').blur(); moveFocus(0); } return; }
    switch (e.key) {
      case 'ArrowDown': e.preventDefault(); moveFocus(1); break;
      case 'ArrowUp': e.preventDefault(); moveFocus(-1); break;
      case 'ArrowRight': e.preventDefault(); hop(1); break;
      case 'ArrowLeft': e.preventDefault(); hop(-1); break;
      case 'PageDown': case 'ChannelDown': e.preventDefault(); step(1); break;
      case 'PageUp': case 'ChannelUp': e.preventDefault(); step(-1); break;
      case 'f': case 'F': {
        const a = document.activeElement;
        toggleFav(a && a.dataset && a.dataset.id ? channels[+a.dataset.id] : current); break;
      }
      case 'h': case 'H': $('app').classList.toggle('hide-ui'); break;
      case 't': case 'T': { const i = KINDS.findIndex(x => x[0] === kind); kind = KINDS[(i + 1) % 3][0]; cat = ALL; renderTabs(); renderCats(); renderChannels(); break; }
      case 'm': case 'M': $('setup').classList.add('open'); break;
      case '/': e.preventDefault(); $('app').classList.remove('hide-ui'); $('search').focus(); break;
      case 'Enter': if (current && $('app').classList.contains('hide-ui')) osd(current); break;
    }
  });
  video.tabIndex = 0;
  video.addEventListener('dblclick', () => document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen());

  // ---------- Início ----------
  const savedUrl = store.get('url', '');
  $('url').value = savedUrl; $('useProxy').checked = store.get('proxy', false);
  if (savedUrl) $('load').click();
})();
</script>
</body>
</html>
